name: Workshop rehearsal evidence

on:
  push:
    branches: [codex/workshop-readme-rehearsal]

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the original contract-test command
        shell: bash
        run: |
          mkdir -p .evidence
          docker compose -f docker-compose.test.yml up --abort-on-container-exit --attach-dependencies 2>&1 | tee .evidence/compose-test.log
      - name: Capture container state and test output
        if: always()
        run: |
          docker compose -f docker-compose.test.yml ps --all > .evidence/containers.txt
          if [ -f test_output.log ]; then cat test_output.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-tests-${{ github.sha }}
          path: |
            .evidence/
            test_output.log
      - name: Clean up the isolated runner
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans

  original-startup-command:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the original startup command with a four-minute deadline
        shell: bash
        run: |
          mkdir -p .evidence
          timeout --signal=TERM --kill-after=30s 240s docker compose -f docker-compose.yml up --abort-on-container-exit --attach-dependencies 2>&1 | tee .evidence/compose-startup.log
      - name: Capture container state
        if: always()
        run: docker compose -f docker-compose.yml ps --all > .evidence/containers.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-startup-${{ github.sha }}
          path: .evidence/
      - name: Clean up the isolated runner
        if: always()
        run: docker compose -f docker-compose.yml down --volumes --remove-orphans
