name: SQL eval checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r eval/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/sql_eval.py build
      - name: Seed isolated database
        run: |
          docker compose -p workshop-sql-eval -f compose.models.yaml -f compose.eval.yaml up -d eval-db eval-seed
          docker compose -p workshop-sql-eval -f compose.models.yaml -f compose.eval.yaml wait eval-seed
      - run: python scripts/sql_eval.py verify-gold
      - run: python scripts/sql_eval.py isolation
      - name: Check database permissions and query limits
        run: >-
          docker compose -p workshop-sql-eval -f compose.models.yaml -f compose.eval.yaml
          run --rm --no-deps
          -e EVAL_TEST_DSN=postgresql://eval_reader:eval_reader@eval-db:5432/museum_eval
          -e PYTHONPATH=/app
          -v "$PWD/tests/test_sql_eval_integration.py:/checks/test_integration.py:ro"
          --entrypoint python eval-scorer /checks/test_integration.py -v
      - name: Check restore and protection without inference
        run: |
          python scripts/sql_eval.py revert
          python scripts/sql_eval.py protect
          if python scripts/sql_eval.py protect --prompt eval/prompts/regressed.json; then
            echo "The regressed prompt unexpectedly passed its contract."
            exit 1
          fi
      - name: Stop this job's containers
        if: always()
        run: docker compose -p workshop-sql-eval -f compose.models.yaml -f compose.eval.yaml down
